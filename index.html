<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#d97706">
    <title>Frankie's Magic Lamp</title>
    <script src="https://www.puck-js.com/puck.js"></script>
    <style>
        :root {
            --bg-overlay: rgba(28, 25, 23, 0.85); /* Deep charcoal/brown overlay */
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(217, 119, 6, 0.2); /* Subtle gold border */
            --text: #fef3c7; /* Warm cream text */
            --accent: #f59e0b; /* Gold accent */
            --cork: #a8a29e; /* Muted cork/stone colour */
            --glow: #fde68a; /* Warm fairy light glow */
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Background uses your jar image [cite: 332] */
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('icon.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
        }

        .container {
            width: 90%;
            max-width: 380px;
            background: var(--glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 30px;
            border-radius: 35px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--accent);
            opacity: 0.8;
            font-weight: 600;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        /* Status follower now uses a warm white/gold glow  */
        .led.active { 
            background: var(--glow); 
            box-shadow: 0 0 15px var(--glow), 0 0 5px white; 
        }

        h1 { font-size: 1.25rem; font-weight: 300; margin: 0; letter-spacing: 1px; }

        .btn {
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            border: none;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .btn:active { transform: scale(0.97); }

        .btn-connect { 
            background: var(--accent); 
            color: #451a03; 
            box-shadow: 0 4px 20px rgba(217, 119, 6, 0.4);
        }

        .btn-off { 
            background: transparent; 
            color: var(--cork); 
            border: 1px solid var(--cork);
            margin-top: 25px;
            font-size: 0.85rem;
            opacity: 0.7;
        }
        .btn-off:hover { background: rgba(168, 162, 158, 0.1); opacity: 1; }

        .control-panel {
            background: rgba(0, 0, 0, 0.25);
            padding: 22px;
            border-radius: 25px;
            margin-top: 15px;
        }

        .label-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.7rem; 
            color: var(--cork); 
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        select.mode-select {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text);
            border: 1px solid var(--glass-border);
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 25px;
            outline: none;
            appearance: none;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -9px;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-header">
        <h1>Frankie's Lamp</h1>
        <div class="info-row">
            <span id="batt-lvl">--%</span>
            <div id="led-indicator" class="led"></div>
        </div>
    </div>
    
    <button id="conn-btn" class="btn btn-connect" onclick="connect()">Wake Magic Lamp</button>
    
    <div id="controls" style="display:none;">
        <div class="control-panel">
            <div class="label-row"><span>Lighting Mode</span></div>
            <select id="mode-select" class="mode-select" onchange="updateMode()">
                <option value="flash">✨ Flashing</option>
                <option value="on">🕯️ Always On</option>
            </select>

            <div id="freq-container">
                <div class="label-row">
                    <span>Frequency</span>
                    <span style="color: var(--accent)"><span id="hz-disp">1.0</span> Hz</span>
                </div>
                <input type="range" id="freq" min="0.2" max="10" step="0.1" value="1.0" oninput="updateFreq(this.value)">
            </div>
        </div>

        <button class="btn btn-off" onclick="send('powerOff()')">turn off</button>
    </div>
</div>

<script>
    let bt = null;
    const led = document.getElementById('led-indicator');

    function connect() {
        Puck.connect(c => {
            if (!c) return;
            bt = c;
            led.classList.add('active');
            document.getElementById('conn-btn').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            updateBattery();
            setInterval(updateBattery, 60000); 
        });
    }

    function send(cmd) {
        if (bt) bt.write(cmd + ";\n");
    }

    function updateBattery() {
        if (!bt) return;
        Puck.eval('Puck.getBatteryPercentage()', (p) => {
            if (p !== null) document.getElementById('batt-lvl').innerText = p + "%";
        });
    }

    function updateMode() {
        const mode = document.getElementById('mode-select').value;
        const freqCont = document.getElementById('freq-container');
        if (mode === 'on') {
            freqCont.style.opacity = "0.2";
            freqCont.style.pointerEvents = "none";
            send('allOn()');
        } else {
            freqCont.style.opacity = "1";
            freqCont.style.pointerEvents = "auto";
            send(`start(${document.getElementById('freq').value})`);
        }
    }

    function updateFreq(hz) {
        document.getElementById('hz-disp').innerText = hz;
        send(`start(${hz})`);
    }
</script>

</body>
</html>
