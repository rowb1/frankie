<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="theme-color" content="#10b981">
    <title>Frankie's Magic Lamp</title>
    <script src="https://www.puck-js.com/puck.js"></script>
    <style>
        :root {
            --bg-overlay: rgba(15, 23, 42, 0.75);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text: #f8fafc;
            --accent: #10b981;
            --warn: #ef4444;
            --battery: #38bdf8;
            --status-blue: #3b82f6;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Use your jar image as the fixed background */
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                        url('icon.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
        }

        .container {
            width: 90%;
            max-width: 380px;
            /* Frosted glass effect */
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 28px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--battery);
            letter-spacing: 0.5px;
        }

        .led {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        /* Pulse glow for the Blue LED status */
        .led.active { 
            background: var(--status-blue); 
            box-shadow: 0 0 15px var(--status-blue), 0 0 5px white; 
        }

        h1 { font-size: 1.2rem; font-weight: 300; margin: 0; opacity: 0.9; }

        .btn {
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: none;
            border-radius: 15px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active { transform: scale(0.96); opacity: 0.8; }

        .btn-connect { 
            background: var(--accent); 
            color: #064e3b; 
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-off { 
            background: rgba(239, 68, 68, 0.1); 
            color: var(--warn); 
            border: 1px solid var(--warn);
            margin-top: 20px;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .label-row { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.75rem; 
            color: #94a3b8; 
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        select.mode-select {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--glass-border);
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            outline: none;
        }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: var(--status-blue);
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 0 10px var(--status-blue);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-header">
        <h1>Frankie's Lamp</h1>
        <div class="info-row">
            <span id="batt-lvl">--%</span>
            <div id="led-indicator" class="led"></div>
        </div>
    </div>
    
    <button id="conn-btn" class="btn btn-connect" onclick="connect()">Wake Magic Lamp</button>
    
    <div id="controls" style="display:none;">
        <div class="control-panel">
            <div class="label-row"><span>Mode</span></div>
            <select id="mode-select" class="mode-select" onchange="updateMode()">
                <option value="flash">✨ Flashing</option>
                <option value="on">🕯️ Always On</option>
            </select>

            <div id="freq-container">
                <div class="label-row">
                    <span>Frequency</span>
                    <span style="color: var(--status-blue)"><span id="hz-disp">1.0</span> Hz</span>
                </div>
                <input type="range" id="freq" min="0.2" max="10" step="0.1" value="1.0" oninput="updateFreq(this.value)">
            </div>
        </div>

        <button class="btn btn-off" onclick="send('powerOff()')">Master Sleep</button>
    </div>
</div>

<script>
    let bt = null;
    const led = document.getElementById('led-indicator');

    function connect() {
        Puck.connect(c => {
            if (!c) return;
            bt = c;
            led.classList.add('active');
            document.getElementById('conn-btn').style.display = 'none';
            document.getElementById('controls').style.display = 'block';
            updateBattery();
            setInterval(updateBattery, 60000); 
        });
    }

    function send(cmd) {
        if (bt) bt.write(cmd + ";\n");
    }

    function updateBattery() {
        if (!bt) return;
        Puck.eval('Puck.getBatteryPercentage()', (p) => {
            if (p !== null) document.getElementById('batt-lvl').innerText = p + "%";
        });
    }

    function updateMode() {
        const mode = document.getElementById('mode-select').value;
        const freqCont = document.getElementById('freq-container');
        if (mode === 'on') {
            freqCont.style.opacity = "0.2";
            freqCont.style.pointerEvents = "none";
            send('allOn()');
        } else {
            freqCont.style.opacity = "1";
            freqCont.style.pointerEvents = "auto";
            send(`start(${document.getElementById('freq').value})`);
        }
    }

    function updateFreq(hz) {
        document.getElementById('hz-disp').innerText = hz;
        send(`start(${hz})`);
    }
</script>

</body>
</html>
